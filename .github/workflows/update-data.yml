name: Update Bili Dashboard Data

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Bilibili data
        shell: pwsh
        env:
          TZ: Asia/Shanghai
        run: ./fetch-bilibili.ps1

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots.csv data.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update bilibili dashboard data"
            git push
          fi
